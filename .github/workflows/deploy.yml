name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare Static Export for GitHub Pages
        run: rm -rf src/app/api src/app/\(dashboard\)

      - name: Build with Next.js (Static Export for GitHub Pages)
        env:
          GITHUB_ACTIONS: "true"
        run: |
          npx next build
          touch ./out/.nojekyll
          node -e '
            const fs = require("fs");
            const path = require("path");
            const cssDir = "./out/_next/static/css";
            if (fs.existsSync(cssDir)) {
              const cssFiles = fs.readdirSync(cssDir).filter(f => f.endsWith(".css"));
              const allCss = cssFiles.map(f => fs.readFileSync(path.join(cssDir, f), "utf8")).join("\n");
              const htmlPath = "./out/index.html";
              if (fs.existsSync(htmlPath) && allCss) {
                const html = fs.readFileSync(htmlPath, "utf8");
                fs.writeFileSync(htmlPath, html.replace("</head>", `<style>${allCss}</style></head>`));
              }
            }
          '

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
